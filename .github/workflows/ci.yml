name: Node.js CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request' && github.run_attempt == '1' && github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == '1' }}

jobs:
  verify_files:
    name: Verify Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build:embedded # check that build works
      - run: npm run package # check that package build works

  unit_tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - name: Release report Docker smoke
        timeout-minutes: 15
        run: node .github/workflows/scripts/smoke-release-report.js

  control_plane_e2e:
    name: Mocked control plane UI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # Same approach as scripts/playwright-docker.sh: the Playwright image matches the
      # lockfile version and does not depend on the runner OS being supported by Playwright.
      - name: Run mocked UI tests in the Playwright Docker image
        run: |
          PLAYWRIGHT_VERSION=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          docker run --rm \
            -v "${PWD}:/work" \
            -w /work \
            -e CI=true \
            "mcr.microsoft.com/playwright:v${PLAYWRIGHT_VERSION}-noble" \
            /bin/bash -c "npm ci && npm run test:e2e:control-plane"
      - name: Upload mocked UI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: control-plane-ui-artifacts
          path: playwright-artifacts/control-plane
          retention-days: 5
