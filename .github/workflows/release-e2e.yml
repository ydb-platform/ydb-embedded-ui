name: Release UI E2E trace comparison
run-name: 'Trace comparison: local-ydb26.2.1.14 / UI15.6.0-hotfix.1 / shard6of8'

on:
  workflow_dispatch:
    inputs:
      ydb_tag:
        description: Fixed diagnostic release (26.2.1.14)
        required: true
        default: '26.2.1.14'
        type: string
      ydb_sha:
        description: Optional expected YDB SHA
        required: false
        type: string

permissions:
  contents: read

jobs:
  compare:
    name: Three sequential trace pairs (shard 6/8)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      COMPARE_ROOT: ${{ github.workspace }}/experiment
      HARNESS: ${{ github.workspace }}/diagnostic/.github/diagnostics/release-e2e-compare
    steps:
      - name: Require the diagnostic branch and fixed release
        env:
          YDB_TAG: ${{ inputs.ydb_tag }}
          YDB_SHA: ${{ inputs.ydb_sha }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/codex/release-e2e-github-compare-20260927 ] || [ "$YDB_TAG" != 26.2.1.14 ]; then
            echo '::error::This temporary workflow only runs the fixed trace comparison.'
            exit 1
          fi
          if [ -n "$YDB_SHA" ] && [ "$YDB_SHA" != 1bd0f9c372384549fe4ff21c29f44609a20f5450 ]; then
            echo '::error::Unexpected YDB revision.'
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: diagnostic
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 71b800f1d788ce7cbb339984ee3541999026ea18
          path: experiment/controller
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.13.1'
      - name: Verify pinned inputs, browsers, fonts, backend and shard inventory
        id: prepare
        timeout-minutes: 15
        run: python3 "$HARNESS/compare.py" prepare
      - name: Upload preflight evidence
        if: always() && steps.prepare.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trace-compare-preflight
          path: |
            experiment/inventory/
            experiment/provenance.json
            experiment/pins.json
            experiment/source-sha256.txt
            experiment/*.log
            experiment/status.json
          if-no-files-found: error
          retention-days: 30

      - name: Trial 1 - trace retain-on-failure
        id: trial_1
        timeout-minutes: 40
        run: python3 "$HARNESS/compare.py" trial 1
      - name: Upload trial 1 evidence
        id: upload_1
        if: always() && steps.trial_1.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trace-compare-1-a
          path: experiment/trials/github-shard6-1-a/
          if-no-files-found: error
          retention-days: 30

      - name: Trial 2 - trace off
        id: trial_2
        timeout-minutes: 40
        run: python3 "$HARNESS/compare.py" trial 2
      - name: Upload trial 2 evidence
        id: upload_2
        if: always() && steps.trial_2.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trace-compare-2-b
          path: experiment/trials/github-shard6-2-b/
          if-no-files-found: error
          retention-days: 30

      - name: Trial 3 - trace off
        id: trial_3
        timeout-minutes: 40
        run: python3 "$HARNESS/compare.py" trial 3
      - name: Upload trial 3 evidence
        id: upload_3
        if: always() && steps.trial_3.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trace-compare-3-b
          path: experiment/trials/github-shard6-3-b/
          if-no-files-found: error
          retention-days: 30

      - name: Trial 4 - trace retain-on-failure
        id: trial_4
        timeout-minutes: 40
        run: python3 "$HARNESS/compare.py" trial 4
      - name: Upload trial 4 evidence
        id: upload_4
        if: always() && steps.trial_4.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trace-compare-4-a
          path: experiment/trials/github-shard6-4-a/
          if-no-files-found: error
          retention-days: 30

      - name: Trial 5 - trace retain-on-failure
        id: trial_5
        timeout-minutes: 40
        run: python3 "$HARNESS/compare.py" trial 5
      - name: Upload trial 5 evidence
        id: upload_5
        if: always() && steps.trial_5.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trace-compare-5-a
          path: experiment/trials/github-shard6-5-a/
          if-no-files-found: error
          retention-days: 30

      - name: Trial 6 - trace off
        id: trial_6
        timeout-minutes: 40
        run: python3 "$HARNESS/compare.py" trial 6
      - name: Upload trial 6 evidence
        id: upload_6
        if: always() && steps.trial_6.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trace-compare-6-b
          path: experiment/trials/github-shard6-6-b/
          if-no-files-found: error
          retention-days: 30

      - name: Verify cleanup of all experiment resources
        if: always() && steps.prepare.outcome != 'skipped'
        run: python3 "$HARNESS/compare.py" cleanup
      - name: Summarize completeness and test outcomes
        env:
          UPLOAD_RESULTS: '${{ steps.upload_1.outcome }} ${{ steps.upload_2.outcome }} ${{ steps.upload_3.outcome }} ${{ steps.upload_4.outcome }} ${{ steps.upload_5.outcome }} ${{ steps.upload_6.outcome }}'
        if: always() && steps.prepare.outcome != 'skipped'
        run: python3 "$HARNESS/compare.py" summarize
      - name: Upload final metadata
        if: always() && steps.prepare.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trace-compare-summary
          path: |
            experiment/status.json
            experiment/summary.json
            experiment/summary.md
            experiment/cleanup.json
            experiment/provenance.json
            experiment/pins.json
          if-no-files-found: error
          retention-days: 30
