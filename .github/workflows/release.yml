on:
  push:
    branches:
      - main
      - hotfix/v[0-9]+.[0-9]+.[0-9]+* # match branches in format hotfix/v6.20.10 and hotfix/v6.20.10-hotfix.1
  workflow_dispatch:
    inputs:
      publish_beta:
        description: Publish an npm beta package
        type: boolean
        default: false
      source_sha:
        description: Full commit SHA to build for a beta release
        type: string
      npm_tag:
        description: npm distribution tag for the beta release
        type: string

name: Release

permissions:
  contents: write
  id-token: write
  packages: write
  pull-requests: write

jobs:
  release:
    if: >-
      github.repository == 'ydb-platform/ydb-embedded-ui' &&
      (github.event_name != 'workflow_dispatch' || !inputs.publish_beta)
    runs-on: ubuntu-latest
    env:
      ASSET_NAME: embedded-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          target-branch: ${{ github.ref_name }}
          token: ${{ secrets.YDB_PLATFORM_BOT_TOKEN_REPO }}

      # Publication steps - only run if release was created
      - name: Publish to npm
        if: steps.release.outputs.release_created == 'true'
        run: |
          VERSION="${{ steps.release.outputs.tag_name }}"
          # Remove 'v' prefix if present
          VERSION="${VERSION#v}"

          # Determine npm dist-tag based on version
          if [[ "$VERSION" =~ -hotfix\. ]]; then
            # Hotfix versions get their own tag
            echo "Publishing hotfix version $VERSION with tag 'hotfix'"
            npm publish --tag hotfix
          elif [[ "$VERSION" =~ -(alpha|beta|rc)\. ]]; then
            # Alpha/beta/rc versions get 'next' tag
            echo "Publishing prerelease version $VERSION with tag 'next'"
            npm publish --tag next
          elif [[ "$VERSION" =~ - ]]; then
            # Other prerelease versions (e.g., -canary, -dev) get 'next' tag
            echo "Publishing prerelease version $VERSION with tag 'next'"
            npm publish --tag next
          else
            # Stable versions get 'latest' tag
            echo "Publishing stable version $VERSION with tag 'latest'"
            npm publish --tag latest
          fi

      - name: Build embedded archive
        if: steps.release.outputs.release_created == 'true'
        run: npm run build:embedded:archive

      - name: Upload archive to release
        if: steps.release.outputs.release_created == 'true'
        run: gh release upload ${{ steps.release.outputs.tag_name }} $ASSET_NAME.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Embedded UI Refresh Event Dispatch
        if: steps.release.outputs.release_created == 'true'
        uses: peter-evans/repository-dispatch@v2
        continue-on-error: true
        with:
          repository: ydb-platform/ydb
          event-type: embedded_ui_refresh
          client-payload: |
            {
              "tag_name": "${{ steps.release.outputs.tag_name }}",
              "asset_name": "${{ env.ASSET_NAME }}",
              "repository": "${{ github.repository }}"
            }

  build-beta-package:
    if: >-
      github.repository == 'ydb-platform/ydb-embedded-ui' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.publish_beta
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Validate beta inputs
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          NPM_TAG: ${{ inputs.npm_tag }}
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_sha must be a full commit SHA"
            exit 1
          fi
          if [[ -z "$NPM_TAG" || "$NPM_TAG" == latest || "$NPM_TAG" =~ [[:space:]] ]]; then
            echo "::error::npm_tag must be a non-empty distribution tag other than latest"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - name: Build the beta package
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          VERSION=$(npm version prerelease --preid=beta --no-git-tag-version --ignore-scripts)
          npm version "${VERSION#v}.sha-${SOURCE_SHA:0:9}" --no-git-tag-version --ignore-scripts
          npm run package
          mkdir -p "$RUNNER_TEMP/npm-beta"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/npm-beta"
      - uses: actions/upload-artifact@v4
        with:
          name: npm-beta-package
          path: ${{ runner.temp }}/npm-beta/*.tgz
          if-no-files-found: error

  publish-beta-package:
    needs: build-beta-package
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: npm-beta-package
          path: npm-beta
      - name: Publish the beta to npm
        env:
          NPM_TAG: ${{ inputs.npm_tag }}
        run: npm publish ./npm-beta/*.tgz --ignore-scripts --registry=https://registry.npmjs.org --tag="$NPM_TAG"
